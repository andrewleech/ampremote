# micropython-branch-manager (mbm)
# Install: pip install micropython-branch-manager
#          or: uv tool install micropython-branch-manager
# Usage:   mbm --help

[[submodules]]
path = "micropython"
integration_branch = "ampremote"

[[submodules.branches]]
name = "mpremote_reconnect"
pr_url = "https://github.com/micropython/micropython/pull/17322"
pr_number = 17322
title = "tools/mpremote: Add automatic reconnection feature"

[[submodules.branches]]
name = "mpremote-resume-by-default"
pr_url = "https://github.com/micropython/micropython/pull/17485"
pr_number = 17485
title = "tools/mpremote: Make resume behavior the default, remove resume command"

# PR #18327 (PTY detection) MERGED upstream 2026-07-14 as e1f8f204b6, so it is
# no longer registered: composing a merged PR replays commits the base already
# has. `_is_pty_device` comes from upstream master now.

